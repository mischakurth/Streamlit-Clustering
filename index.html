<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Clustering Visualizer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.94.0/build/stlite.css">
</head>

<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.94.0/build/stlite.js";
    mount({
      requirements: ["streamlit", "pandas", "numpy", "plotly==5.18.0", "scikit-learn"],
      entrypoint: "app.py",
      files: {
        "app.py": {
          url: "./app.py",
        },
        "data_gen.py": {
          url: "./data_gen.py",
        },
        "algorithms.py": {
          url: "./algorithms.py",
        },
      },
    }, document.getElementById("root"));
  </script>
</body>

</html>
